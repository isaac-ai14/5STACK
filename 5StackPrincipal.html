<!DOCTYPE html>
<html>
    <head>
        <title>5STACK</title>
        <meta charset="UTF-8">
        <link rel="icon" href="imagens/5stacklogo.png" type="image/png">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
        <link rel="stylesheet" href="5stack.css">
        <script src="5stack.js" defer></script>
    </head>
    <body>
        <header class="principal">
            <div class="logo-container">
                <img src="imagens/5stacklogo.png" alt="5STACK Logo" class="logo-img">
                <h1>5STACK</h1>
                <nav class="menu-navegacao">
                    <a href="5StackPrincipal.html" class="link-header">INÍCIO</a>
                    <a href="5StackQuemSomos.html" class="link-header">QUEM SOMOS</a>
                    <a href="5StackContato.html" class="link-header">CONTATO</a>
                </nav>
            </div>
        </header>
        <h3 class="lobby">LOBBY</h3>

        <div class="container-jogadores">
            <div class="party">
                <img src="imagens/cardbanner5.jpg" alt="Card Banner" class="cardbanner">
                <div class="nome-jogador">Lucas</div>
            </div>
            <div class="party">
                <img src="imagens/cardbanner2.jpg" alt="Card Banner" class="cardbanner">
                <div class="nome-jogador">Gabriel</div>
            </div>
            <div class="party">
                <img src="imagens/cardbanner3.jpg" alt="Card Banner" class="cardbanner">
                <div class="nome-jogador">EU</div>
            </div>
            <div class="party">
                <img src="imagens/cardbanner4.jpg" alt="Card Banner" class="cardbanner">
                <div class="nome-jogador">Eduardo</div>
            </div>
            <div class="party party-convidar" id="abrir-convites">
                + Convidar
            </div>
        </div>
        <div class="container-encontrar">
            <button class="encontrar">ENCONTRAR JOGADOR</button>
        </div>

        <div class="modal" id="modal-convites">
            <div class="modal-conteudo">
                <button class="fechar-modal" id="fechar-modal">X</button>

                <h2>CONVIDAR JOGADORES</h2>

                <form id="form-jogador">
                <input type="text" id="nome-jogador-crud" placeholder="Nome do jogador" required>

                <select id="elo-jogador-crud" required>
                    <option value="">Selecione o elo</option>
                    <option value="Ferro">Ferro</option>
                    <option value="Bronze">Bronze</option>
                    <option value="Prata">Prata</option>
                    <option value="Ouro">Ouro</option>
                    <option value="Platina">Platina</option>
                    <option value="Diamante">Diamante</option>
                    <option value="Ascendente">Ascendente</option>
                    <option value="Imortal">Imortal</option>
                    <option value="Radiante">Radiante</option>
                </select>

                <button type="submit">Adicionar jogador</button>
            </form>

                <div id="lista-jogadores"></div>

                <p id="notificacao-convite" role="status" aria-live="polite"></p>
            </div>
        </div>

    </body>
</html>
